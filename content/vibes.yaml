kind: vibes
vibes:
  - id: film-student
    name: Film Student
    accent: "#2BFF88"
    username:
      prefixes: [cine]
      cores: [frame]
      suffixes: [notes]
      casing: snake
    tags: [cinema, film, review]
    ratingModel:
      love:
        mean: 4.2
        standardDeviation: 0.5
      hate:
        mean: 1.6
        standardDeviation: 0.6
      heatShift:
        love: {0: 0, 1: 0, 2: 0.5, 3: 0.5}
        hate: {0: 0, 1: -0.5, 2: -1, 3: -1.5}
    rules:
      origin:
        - t: "#opener# #body# #kicker#"
      opener:
        - t: "#titleShort# has a pulse."
      body:
        - t: "The final image earns its place."
      kicker:
        - t: "I will be thinking about it for days."

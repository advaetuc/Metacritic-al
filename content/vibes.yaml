kind: vibes
vibes:
  - id: film-student
    name: Film Student
    accent: "#2BFF88"
    username:
      prefixes: [cine]
      cores: [frame]
      suffixes: [notes]
      casing: snake
    tags: [cinema, film, review]
    ratingModel: &base-rating-model
      love:
        mean: 4.2
        standardDeviation: 0.5
      hate:
        mean: 1.6
        standardDeviation: 0.6
      heatShift:
        love: {0: 0, 1: 0, 2: 0.5, 3: 0.5}
        hate: {0: 0, 1: -0.5, 2: -1, 3: -1.5}
    rules:
      origin:
        - t: "#opener# #body# #kicker#"
      opener:
        - t: "#titleShort# has a pulse."
      body:
        - t: "The final image earns its place."
      kicker:
        - t: "I will be thinking about it for days."
  - id: shitposter
    name: Shitposter
    accent: "#FF7A2F"
    username:
      prefixes: [plot]
      cores: [goblin]
      suffixes: [online]
      casing: lower
    tags: [brainrot, cinema, no-context]
    ratingModel: *base-rating-model
    rules:
      origin:
        - t: "#opener# #body# #kicker#"
      opener:
        - t: "#titleShort# walked so the discourse could run."
      body:
        - t: "One scene has already escaped containment."
      kicker:
        - t: "Anyway, I made it everyone else's problem."
  - id: mid
    name: Aggressively Mid
    accent: "#FFC857"
    username:
      prefixes: [average]
      cores: [take]
      suffixes: [enjoyer]
      casing: camel
    tags: [mid, balanced, cinema]
    ratingModel: *base-rating-model
    rules:
      origin:
        - t: "#opener# #body# #kicker#"
      opener:
        - t: "#titleShort# is exactly as good as it needed to be."
      body:
        - t: "Nothing here changed my life or my plans for dinner."
      kicker:
        - t: "A sturdy three-star evening."
  - id: dad
    name: Dad
    accent: "#7CFFB5"
    username:
      prefixes: [popcorn]
      cores: [uncle]
      suffixes: [jr]
      casing: snake
    tags: [dad-take, popcorn, family-night]
    ratingModel: *base-rating-model
    rules:
      origin:
        - t: "#opener# #body# #kicker#"
      opener:
        - t: "#titleShort# kept me off my phone."
      body:
        - t: "The seats were comfortable and nobody asked me to explain the plot."
      kicker:
        - t: "I'd watch it again after mowing the lawn."
  - id: stan
    name: Stan
    accent: "#FF6FAE"
    username:
      prefixes: [number]
      cores: [one]
      suffixes: [defender]
      casing: lower
    tags: [no-notes, favorite, stan-account]
    ratingModel: *base-rating-model
    rules:
      origin:
        - t: "#opener# #body# #kicker#"
      opener:
        - t: "#titleShort# is the moment."
      body:
        - t: "Every frame deserves its own fan account."
      kicker:
        - t: "I will be defending this online until further notice."
  - id: festival-snob
    name: Festival Snob
    accent: "#B39AFF"
    username:
      prefixes: [late]
      cores: [screening]
      suffixes: [notes]
      casing: snake
    tags: [festival-circuit, long-take, cinema]
    ratingModel: *base-rating-model
    rules:
      origin:
        - t: "#opener# #body# #kicker#"
      opener:
        - t: "#titleShort# understands the useful silence between frames."
      body:
        - t: "The restraint is either precise or very well lit."
      kicker:
        - t: "I saw it before the conversation caught up."
  - id: linkedin
    name: LinkedIn Critic
    accent: "#66B8FF"
    username:
      prefixes: [cinema]
      cores: [synergy]
      suffixes: [leader]
      casing: camel
    tags: [thought-leadership, storytelling, lessons]
    ratingModel: *base-rating-model
    rules:
      origin:
        - t: "#opener# #body# #kicker#"
      opener:
        - t: "#titleShort# delivered a high-impact narrative experience."
      body:
        - t: "The third act aligned key stakeholders around the central insight."
      kicker:
        - t: "Here are five lessons about leadership I took from it."
  - id: conspiracy
    name: Conspiracy Theorist
    accent: "#FF6E5E"
    username:
      prefixes: [frame]
      cores: [evidence]
      suffixes: [archive]
      casing: snake
    tags: [connect-the-dots, hidden-agenda, wake-up]
    ratingModel: *base-rating-model
    rules:
      origin:
        - t: "#opener# #body# #kicker#"
      opener:
        - t: "#titleShort# is asking questions in plain sight."
      body:
        - t: "The background extras are positioned with suspicious confidence."
      kicker:
        - t: "Do your own research. I have a spreadsheet."
